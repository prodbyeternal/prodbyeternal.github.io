  /* iOS 6 Status Bar */
  #status-bar {
    height: 24px;
    background: linear-gradient(to bottom, rgba(38, 44, 52, 0.92) 0%, rgba(12, 16, 22, 0.92) 100%);
    border-bottom: 1px solid rgba(0, 0, 0, 0.7);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.12);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px;
    font-size: 12px;
    font-weight: bold;
    color: #f0f3f8;
    text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.9);
    position: relative;
    z-index: 100;
  }
  .status-left {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .signal-bars {
    display: inline-flex;
    align-items: flex-end;
    gap: 2px;
    height: 11px;
  }
  .signal-bar {
    width: 3px;
    background: #e0e5eb;
    border-radius: 1px 1px 0 0;
    box-shadow: 0 1px 1px rgba(0,0,0,0.6);
  }
  .signal-bar:nth-child(1) { height: 3px; }
  .signal-bar:nth-child(2) { height: 5px; }
  .signal-bar:nth-child(3) { height: 7px; }
  .signal-bar:nth-child(4) { height: 9px; }
  .signal-bar:nth-child(5) { height: 11px; }

  .carrier {
    font-size: 12px;
    letter-spacing: 0.2px;
  }
  .wifi-icon {
    display: inline-block;
    width: 14px;
    height: 11px;

      <div class="slider-knob" id="slider-knob">
        <span class="slider-chevron">&#10148;</span>
      </div>
    </div>
  </div>

<script>
(function () {
    // Clock & Date updates
    var clockEl = document.getElementById("clock");
    var dateEl = document.getElementById("date");
    var DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    var MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    function updateClock() {
        var now = new Date();
        var h = now.getHours();
        var m = now.getMinutes();
        clockEl.textContent = (h < 10 ? "0" + h : h) + ":" + (m < 10 ? "0" + m : m);
        dateEl.textContent = DAYS[now.getDay()] + ", " + MONTHS[now.getMonth()] + " " + now.getDate();
    }
    updateClock();
    setInterval(updateClock, 1000);

    // Jailbreak Elements & State
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    var sliderLabel = document.getElementById("slider-label");
    var sliderWell = document.getElementById("slider-well");
    var sliderKnob = document.getElementById("slider-knob");

    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 };

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + (supported ? " &middot; <span class='ok'>supported</span>"
                     : " &middot; not in this build's kernel table");

    var target = "jb.html" + (location.search ? (location.search.indexOf("log=") >= 0 ? location.search : location.search + "&log=1") : "?log=1");
    var isLaunching = false;

    function go() {
        if (isLaunching) return;
        isLaunching = true;
        setState("loading jailbreak...", "warn");
        sliderLabel.textContent = "jailbreaking...";
        // Animate knob across track
        var maxSlide = sliderWell.clientWidth - sliderKnob.clientWidth - 8;
        sliderKnob.style.transition = "transform 0.25s ease-out";
        sliderKnob.style.transform = "translateX(" + maxSlide + "px)";
        setTimeout(function () {
            location.replace(target);
        }, 300);
    }

    // Interactive Slider Logic (Drag, Click, Key)
    var isDragging = false, startX = 0, currentX = 0;
    function onTouchStart(e) {
        if (isLaunching) return;
        isDragging = true;
        startX = (e.touches ? e.touches[0].clientX : e.clientX);
        sliderKnob.style.transition = "none";
    }
    function onTouchMove(e) {
        if (!isDragging) return;
        var clientX = (e.touches ? e.touches[0].clientX : e.clientX);
        var delta = clientX - startX;
        var maxSlide = sliderWell.clientWidth - sliderKnob.clientWidth - 8;
        currentX = Math.max(0, Math.min(delta, maxSlide));
        sliderKnob.style.transform = "translateX(" + currentX + "px)";
        var progress = currentX / maxSlide;
        sliderLabel.style.opacity = Math.max(0, 1 - progress * 1.5);
    }
    function onTouchEnd() {
        if (!isDragging) return;
        isDragging = false;
        var maxSlide = sliderWell.clientWidth - sliderKnob.clientWidth - 8;
        if (currentX >= maxSlide * 0.55) {
            go();
        } else {
            sliderKnob.style.transition = "transform 0.2s ease-out";
            sliderKnob.style.transform = "translateX(0px)";
            sliderLabel.style.opacity = "1";
        }
    }

    sliderKnob.addEventListener("mousedown", onTouchStart);
    window.addEventListener("mousemove", onTouchMove);
    window.addEventListener("mouseup", onTouchEnd);
    sliderKnob.addEventListener("touchstart", onTouchStart, { passive: true });
    window.addEventListener("touchmove", onTouchMove, { passive: true });
    window.addEventListener("touchend", onTouchEnd);

    // Direct click on track also triggers smooth slide
    sliderWell.addEventListener("click", function (e) {
        if (isLaunching) return;
        if (e.target !== sliderKnob && !sliderKnob.contains(e.target)) {
            go();
        }
    });

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    window.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " " || e.key === "x" || e.key === "X") {
            go();
        }
    });

    if (!supported) {
        setState("UNSUPPORTED FIRMWARE", "bad");
        sliderLabel.textContent = "tap or slide anyway";
        waitForTap("UNSUPPORTED (" + (key || "unknown") + ") -- slide or press X to run anyway", go);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        setState("ready &middot; slide to h4x", "ok");
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true);
        setState("ready &middot; slide to h4x", "ok");
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true);
        setState("ready &middot; slide to h4x", "ok");
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
        waitForTap("UPDATE READY -- press X or tap to reload & run", function () { location.reload(); });
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading", function () {
            setCache("caching for offline (first run)...");
            sliderLabel.textContent = "caching...";
        }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total) {
                var pct = Math.round((e.loaded / e.total) * 100);
                setCache("caching " + pct + "%");
                sliderLabel.textContent = "caching " + pct + "%";
            }
        }, false);
        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            setState("ready &middot; slide to h4x", "ok");
            sliderLabel.textContent = "h4x me!";
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
            waitForTap("UPDATE READY -- press X or tap to reload & run", function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
            setState("ready &middot; slide to h4x", "ok");
            sliderLabel.textContent = "h4x me!";
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
            setState("ready &middot; slide to h4x", "ok");
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            setState("ready &middot; slide to h4x", "ok");
        }, false);
    }
})();
</script>
